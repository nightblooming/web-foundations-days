<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Directory</title>
  <script src="users.js" defer></script>
</head>
<body>
  <main>
    <h1>User Directory</h1>

    <!-- Button to fetch/load users -->
    <button id="load-users" type="button">Load Users</button>

    <!-- Labelled filter input -->
    <div>
      <label for="filter-input">Filter users:</label>
      <input id="filter-input" type="text" placeholder="Type to filter...">
    </div>

    <!-- Status message area -->
    <p id="status" role="status" aria-live="polite"></p>

    <!-- Empty user list container -->
    <ul id="users-list"></ul>
  </main>
</body>
</html>
